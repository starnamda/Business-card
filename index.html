<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAMDA 명함 관리</title><style>
:root{font-family:Inter,"Pretendard",system-ui,-apple-system,sans-serif;color:#17212f;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e9edf2;padding:24px max(20px,calc((100vw - 1080px)/2));}header h1{font-size:24px;letter-spacing:-.7px;margin:0 0 8px;font-weight:750}header p{color:#667487;font-size:14px;margin:0}main{max-width:1080px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:minmax(290px,390px) 1fr;gap:24px;align-items:start}.panel{background:#fff;padding:28px;border:1px solid #e9edf2;border-radius:20px;box-shadow:0 8px 30px #17212f08}.panel h2{font-size:18px;letter-spacing:-.5px;margin:0 0 22px}label{display:block;font-size:13px;font-weight:650;color:#39485c;margin:12px 0 6px}input,textarea,button{font:inherit}input:not([type=file]),textarea{width:100%;padding:12px 14px;border:1px solid #dce3ec;border-radius:11px;outline:none;background:#fff;font-size:14px}input:focus,textarea:focus{border-color:#2b65d9;box-shadow:0 0 0 3px #2b65d91a}input[type=file]{width:100%;font-size:13px;padding:12px;background:#f5f7fb;border-radius:12px}button{border:0;border-radius:11px;background:#225bd6;color:white;padding:11px 16px;font-size:13px;font-weight:650;cursor:pointer;margin:8px 6px 0 0}button:hover{filter:brightness(.94)}#reset,#export{background:#eef3fb;color:#2454a8}.danger{background:#fff1f2;color:#b92f43}.muted{font-size:13px;line-height:1.6;color:#7b8797}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.card{border:1px solid #e6ebf1;border-radius:16px;padding:20px;overflow-wrap:anywhere;background:linear-gradient(180deg,#fff,#fcfdff)}.card h3{margin:10px 0 5px;font-size:19px;letter-spacing:-.4px}.card p{margin:8px 0;font-size:13px;color:#657386;line-height:1.5}.card img{width:100%;height:130px;object-fit:contain;border-radius:10px;background:#f5f7fb}.card button{font-size:12px;padding:8px 12px}#search{margin-bottom:8px}@media(max-width:760px){main{display:block;margin:18px auto;padding:0 14px}.panel{padding:22px;margin-bottom:16px}header{padding:22px 20px}.cards{grid-template-columns:1fr}}
</style></head><body><header><h1>NAMDA AI 명함 관리</h1><p>명함을 등록하고 빠르게 찾아보세요 · 초기 버전</p></header><main><section class="panel"><h2>명함 등록 / 수정</h2><form id="form"><input type="hidden" id="id"><label>이름 *</label><input id="name" required maxlength="100"><label>회사</label><input id="company" maxlength="150"><label>직책</label><input id="title" maxlength="100"><label>전화번호</label><input id="phone" type="tel" maxlength="60"><label>이메일</label><input id="email" type="email" maxlength="150"><label>메모</label><textarea id="memo" rows="3" maxlength="2000"></textarea><label>명함 사진 촬영 · 자동 인식 · 자동 저장</label><input id="photo" type="file" accept="image/*" capture="environment"><button type="submit">저장</button><button type="button" id="reset">새 명함</button></form><p id="ocrStatus" role="status" class="muted">사진을 찍으면 한국어·영어 글자를 인식해 명함을 자동 저장합니다. 인식 오류는 수정할 수 있습니다. 데이터는 이 브라우저에만 저장됩니다.</p></section><section class="panel"><h2>연락처 검색</h2><input id="search" placeholder="이름, 회사, 전화번호, 메모 검색"><button id="export">JSON 백업</button><label for="import" style="display:inline-block;padding:10px;background:#e9eef8;border-radius:8px;cursor:pointer">JSON 복원</label><input id="import" type="file" accept="application/json" style="display:none"><p id="count" class="muted"></p><div id="cards" class="cards"></div></section></main><script>
const KEY='namda_business_cards_v1';let records=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');records=Array.isArray(v)?v:[]}catch{}const $=id=>document.getElementById(id);const fields=['name','company','title','phone','email','memo'];let image='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch{alert('저장 공간이 부족합니다. 사진 크기를 줄여주세요.');return false}};const clean=s=>String(s??'');const esc=s=>clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase();const items=records.filter(x=>fields.some(k=>clean(x[k]).toLowerCase().includes(q)));$('count').textContent=items.length+'개 명함';$('cards').innerHTML=items.map(x=>'<article class="card">'+(x.photo?'<img alt="명함 사진" src="'+esc(x.photo)+'">':'')+'<h3>'+esc(x.name)+'</h3><p>'+esc(x.company)+' · '+esc(x.title)+'</p><p>'+esc(x.phone)+'</p><p>'+esc(x.email)+'</p><p>'+esc(x.memo)+'</p><button data-edit="'+esc(x.id)+'">수정</button><button class="danger" data-delete="'+esc(x.id)+'">삭제</button></article>').join('')||'<p class="muted">등록된 명함이 없습니다.</p>'}function reset(){$('form').reset();$('id').value='';image=''}$('reset').onclick=reset;$('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('사진은 1.5MB 이하만 등록할 수 있습니다.');e.target.value='';return}image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})};$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value||crypto.randomUUID();const item={id,...Object.fromEntries(fields.map(k=>[k,$(k).value.trim()])),photo:image};const old=records.slice();records=[item,...records.filter(x=>x.id!==id)];if(!save()){records=old;return}reset();render()};$('cards').onclick=e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;const x=records.find(x=>x.id===id);if(!x)return;if(e.target.dataset.delete){if(confirm('이 명함을 삭제할까요?')){records=records.filter(y=>y.id!==id);save();render()}}else{$('id').value=x.id;fields.forEach(k=>$(k).value=clean(x[k]));image=x.photo||'';scrollTo({top:0,behavior:'smooth'})}};$('search').oninput=render;$('export').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='namda-cards-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x.name==='string'))throw Error('invalid');if(!confirm('현재 명함을 백업 파일로 교체할까요?'))return;const old=records;records=arr.map(x=>({id:crypto.randomUUID(),...Object.fromEntries(fields.map(k=>[k,clean(x[k])])),photo:typeof x.photo==='string'&&x.photo.startsWith('data:image/')?x.photo:''}));if(!save())records=old;render()}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};render();</script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="./ocr.js"></script></body></html>
